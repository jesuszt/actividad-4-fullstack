<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema | Gestión de Productos</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <span>ProductHub</span>
    </a>
  </nav>

  <main>
    <div class="auth-container">
      <div class="auth-header">
        <h1 id="auth-title">Iniciar Sesión</h1>
        <p id="auth-subtitle">Ingresa tus credenciales para acceder a la gestión de productos</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">
          Iniciar Sesión
        </button>
        <button type="button" class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">
          Registrarse
        </button>
      </div>

      <div id="auth-alert" class="alert"></div>

      <!-- Formulario de Login -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" class="form-control" placeholder="ejemplo@correo.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-login-submit">
          Ingresar al Panel
        </button>
      </form>

      <!-- Formulario de Registro -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label for="register-name">Nombre Completo</label>
          <input type="text" id="register-name" class="form-control" placeholder="Juan Pérez" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="register-email">Correo Electrónico</label>
          <input type="email" id="register-email" class="form-control" placeholder="ejemplo@correo.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="register-password">Contraseña</label>
          <input type="password" id="register-password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-register-submit">
          Crear Cuenta
        </button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ProductHub - Sistema de Gestión de Productos con JWT &amp; Express</p>
  </footer>

  <script src="/js/auth.js"></script>
</body>
</html>
